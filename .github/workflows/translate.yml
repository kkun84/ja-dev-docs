name: translate

# 翻訳リクエストの列を処理する。Workerがリクエストのたびに起動し、1時間ごとにも起動する。
# 1時間ごとの起動は、無料枠の上限で後回しにしたページを、上限が戻った後に訳すため。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 列とは別に訳すページのURL(空白区切り)。空なら列を処理する
        required: false
  schedule:
    - cron: "17 * * * *"
  # 実装中の確かめ用。mainに入れる前に消す。
  push:
    branches: [pipeline]
    paths: [pipeline/*.ts]

permissions:
  contents: write

# 同時に走らせない。実行中に起動されたものは、終わるのを待ってから列を確かめ直す。
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Translate and publish
        env:
          URLS: ${{ inputs.urls || (github.event_name == 'push' && 'https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github https://docs.github.com/en/get-started/learning-about-github/access-permissions-on-github') || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: ${{ vars.SITE_URL }}
          QUEUE_SECRET: ${{ secrets.QUEUE_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node pipeline/run.ts
