name: deploy

# サイトとWorkerをビルドしてCloudflare Workersに出す。翻訳のジョブから呼ばれるほか、
# サイトのコードがmainに入ったときと、手で起動したときにも動く。デプロイだけが失敗しても、やり直せる。
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/**, worker/**, public/**, content/**, migrations/**, astro.config.mjs, wrangler.jsonc, package.json, package-lock.json, scripts/deploy.sh]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Cloudflareの準備がまだなら、ビルドの確認だけをする。
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 翻訳のジョブがpushしたコミットも含めるため、mainの最新を取る。
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ビルドには秘密を渡さない。
      - run: npm run build
      - name: Deploy
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          bash scripts/deploy.sh
          node pipeline/published.ts
