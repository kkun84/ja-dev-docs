name: deploy

# サイトとWorkerをビルドしてCloudflare Workersに出す。翻訳のジョブから呼ばれるほか、
# サイトのコードがmainに入ったときと、手で起動したときにも動く。デプロイだけが失敗しても、やり直せる。
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      [
        src/**,
        worker/**,
        public/**,
        content/**,
        migrations/**,
        astro.config.mjs,
        wrangler.jsonc,
        package.json,
        pnpm-lock.yaml,
        pnpm-workspace.yaml,
        scripts/deploy.sh
      ]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Cloudflareの準備がまだなら、ビルドの確認だけをする。
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # 翻訳のジョブがpushしたコミットも含めるため、mainの最新を取る。
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ビルドには秘密を渡さない。
      - run: pnpm build
      - name: Deploy
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          bash scripts/deploy.sh
          node pipeline/published.ts
