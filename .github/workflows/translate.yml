name: translate

# 翻訳リクエストの列を処理する。Workerがリクエストのたびに起動し、1時間ごとにも起動する。
# 1時間ごとの起動は、無料枠の上限で後回しにしたページを、上限が戻った後に訳すため。
# 1回の実行で訳すのは最大5ページ。訳したら公開し、列に残っていれば次の実行を起動する。
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 列とは別に訳すページのURL(空白区切り)。空なら列を処理する
        required: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

# 同時に走らせない。実行中に起動されたものは、終わるのを待ってから列を確かめ直す。
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.run.outputs.publish }}
      more: ${{ steps.run.outputs.more }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - id: run
        name: Translate
        env:
          URLS: ${{ inputs.urls }}
          # 訳文のコミットとpushでは、手元の開発用のGitフックを動かさない。
          LEFTHOOK: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # 列(D1)の読み書きにだけ使う。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/entrypoints/node/job.ts

  deploy:
    needs: translate
    if: ${{ needs.translate.outputs.publish == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # 列にまだ残っていれば、次の実行を起動する。
  continue:
    needs: [translate, deploy]
    if: ${{ always() && needs.translate.outputs.more == 'true' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run translate.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
