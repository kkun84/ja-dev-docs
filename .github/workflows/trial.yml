name: Trial translation

# 試訳のブランチに試訳のスクリプトやページ一覧を積むと、Geminiで訳して結果をブランチにコミットする。
on:
  push:
    branches: [trial]
    paths:
      - "tools/trial/**"
      - ".github/workflows/trial.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trial
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Translate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -rf trial/seg2
          python tools/trial/segment.py --out trial/seg2 --legend --chain gemini-3.5-flash-lite gemini-3.5-flash-lite gemini-3.5-flash-lite --repeat 3

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial/seg2
          git commit -m "試訳の結果 (${GITHUB_SHA::7})" || exit 0
          git pull --rebase origin trial && git push
